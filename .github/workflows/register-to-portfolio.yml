# 向 kingning2/xiaoman-projects 注册/更新资产卡片。
#
# 触发：
#   - workflow_run：「Deploy to GitHub Pages」在 main 上成功后
#   - workflow_dispatch：手动
#   - push：main 分支（未配置 Pages 部署时也可同步卡片元数据）
#
# Secrets（本仓库 Settings → Actions，勿写入代码）：
#   PORTFOLIO_PAT — 向 xiaoman-projects 主人索取
#   PORTFOLIO_REGISTER_KEY — 同上；粘贴 Secret 时勿带末尾换行

name: Register to portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
    branches: [main]

jobs:
  register:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Send asset to xiaoman-projects
        uses: actions/github-script@v7
        env:
          PORTFOLIO_REGISTER_KEY: ${{ secrets.PORTFOLIO_REGISTER_KEY }}
        with:
          github-token: ${{ secrets.PORTFOLIO_PAT }}
          script: |
            const wr = context.payload.workflow_run;
            const repo = wr?.head_repository ?? context.repo;

            // --- 按本仓库定制 ---
            const ASSET_TYPE = "project"; // "project" | "tool"
            const ASSET_NAME = "SupportFlow";
            const ASSET_DESCRIPTION =
              "Tauri 2 + Next.js 桌面端，内置 SupportFlow 控制台（AI Elements 流式对话、Rust agent runtime），Command/Event IPC 与 Modal 子窗口。";
            const ASSET_TAGS = [
              "Tauri",
              "Next.js",
              "SupportFlow",
              "AI Elements",
              "Rust",
              "Desktop",
            ];
            const ASSET_PROBLEM_SOLVED = ""; // ASSET_TYPE 为 tool 时必填
            // --- end customize ---

            const updatedRaw = wr?.updated_at || new Date().toISOString();
            const updatedAt = String(updatedRaw).slice(0, 10);

            const payload = {
              registerKey: (process.env.PORTFOLIO_REGISTER_KEY || "").trim(),
              id: repo.name ?? repo.repo,
              type: ASSET_TYPE,
              name: ASSET_NAME,
              description: ASSET_DESCRIPTION,
              githubUrl: `https://github.com/${repo.full_name ?? `${repo.owner}/${repo.repo}`}`,
              tags: ASSET_TAGS,
              updatedAt,
            };

            if (ASSET_TYPE === "tool") {
              payload.problemSolved = ASSET_PROBLEM_SOLVED;
            }

            if (!payload.registerKey) {
              core.setFailed("PORTFOLIO_REGISTER_KEY secret is missing");
              return;
            }

            await github.rest.repos.createDispatchEvent({
              owner: "kingning2",
              repo: "xiaoman-projects",
              event_type: "upsert-asset",
              client_payload: payload,
            });
