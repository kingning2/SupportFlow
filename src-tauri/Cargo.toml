[workspace]
resolver = "2"
members = [
    ".",
    "crates/fs_io",
    "crates/models",
    "crates/channel_runtime",
    "crates/cli",
]

[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "tauri-app"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop", "channel-wx", "channel-wework"]
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-dialog",
]
channel-wx = []
channel-wework = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }

[dependencies]
fs_io = { path = "crates/fs_io" }
models = { path = "crates/models" }
channel_runtime = { path = "crates/channel_runtime" }
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typeshare = "1.0"
schemars = { version = "0.8", features = ["preserve_order"] }
url = "2"
directories = "5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "process", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
rsa = "0.9"
sha2 = "0.10"
signature = "2"
# --- agent / bridge (src/services/agent) ---
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock", "std"] }
futures-util = "0.3"
md5 = "0.7"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
encoding_rs = "0.8"
chardetng = "0.1"
pdf-extract = "0.7"
calamine = "0.26"
zip = "2"
dirs = "6"
regex = "1"
shlex = "1"
similar = "2"
tracing = "0.1"
walkdir = "2"
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }

[dev-dependencies]
tempfile = "3"
