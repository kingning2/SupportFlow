[package]
name = "process_runtime"
version = "0.1.0"
edition = "2021"
description = "Language-agnostic child process infrastructure: oneshot, stdio RPC, slots, task-local context"

[dependencies]
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tracing = "0.1"

[features]
default = []
