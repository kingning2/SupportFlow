[package]
name = "cli"
version = "0.1.0"
edition = "2021"
description = "SupportFlow CLI (sf) — manage agent workspace, skills, and headless chat"
default-run = "sf"

[[bin]]
name = "sf"
path = "src/main.rs"

[dependencies]
tauri-app = { path = "../..", default-features = false }
fs_io = { path = "../fs_io" }
models = { path = "../models" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = "2"
regex = "1"

[package.metadata.cargo-machete]
ignored = []
