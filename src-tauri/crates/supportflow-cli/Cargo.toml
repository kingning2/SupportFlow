[package]
name = "supportflow-cli"
version = "0.1.0"
edition = "2021"
description = "SupportFlow CLI (sf) — manage agent workspace, skills, and headless chat"
default-run = "sf"

[[bin]]
name = "sf"
path = "src/main.rs"

[dependencies]
agent = { path = "../agent" }
bridge = { path = "../bridge" }
models = { path = "../models" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = "2"
walkdir = "2"
regex = "1"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }
